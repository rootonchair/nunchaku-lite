name: Release Wheels

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

env:
  CUDA_VISIBLE_DEVICES: ""

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install Ruff
        run: |
          python -m pip install --upgrade pip
          python -m pip install ruff

      - name: Run Ruff
        run: ruff check .

  validate-version:
    name: Validate Version
    runs-on: ubuntu-latest
    needs: lint
    outputs:
      release-version: ${{ steps.validate.outputs.release-version }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate package version
        id: validate
        run: |
          python - <<'PY'
          import os
          from pathlib import Path

          version_locals = {}
          exec(Path("src/nunchaku_lite/__version__.py").read_text(), version_locals)
          version = version_locals["__version__"]
          event_name = os.environ["GITHUB_EVENT_NAME"]
          release_version = ""

          if event_name == "push":
              tag_version = os.environ["GITHUB_REF_NAME"].removeprefix("v")
              if version not in {tag_version, f"{tag_version}dev"}:
                  raise SystemExit(
                      f"Package version {version!r} must match tag {tag_version!r} "
                      f"or its dev version {tag_version + 'dev'!r}."
                  )
              release_version = tag_version

          print(f"package version: {version}")
          if release_version:
              print(f"release version: {release_version}")

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output_file:
              output_file.write(f"release-version={release_version}\n")
          PY

  wheels:
    name: Wheel
    runs-on: ubuntu-latest
    needs: validate-version

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install build
        run: |
          python -m pip install --upgrade pip
          python -m pip install build

      - name: Build wheel
        env:
          NUNCHAKU_LITE_RELEASE_VERSION: ${{ needs.validate-version.outputs.release-version }}
        run: python -m build --wheel

      - name: Upload wheel artifacts
        uses: actions/upload-artifact@v4
        with:
          name: nunchaku-lite-wheel
          path: dist/*.whl
          if-no-files-found: error

  github-release:
    name: GitHub Release
    runs-on: ubuntu-latest
    needs: wheels
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')

    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Attach artifacts to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          fail_on_unmatched_files: true
