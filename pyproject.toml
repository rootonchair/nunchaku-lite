[build-system]
build-backend = "setuptools.build_meta"
requires = [
  "setuptools>=77",
  "wheel",
]

[project]
name = "nunchaku_lite"
description = "Lite plugin runtime for applying Nunchaku v2 quantized transformer weights to Diffusers (PyTorch) and mflux (MLX) pipelines."
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = [ "LICENSE" ]
dynamic = [ "readme", "version" ]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]
# The base install is the PyTorch runtime (CUDA / Apple MPS). The MLX runtime is the `mlx` extra; nunchaku_lite.mlx
# itself imports without torch (nunchaku_lite/__init__.py is lazy), so `pip install --no-deps` + mlx also works.
dependencies = [
  "accelerate>=0.31",
  "diffusers>=0.36",
  "huggingface-hub>=0.34",
  "kernels>=0.14,<0.15",
  "packaging>=23",
  "peft",
  "safetensors",
  "torch>=2.7",
  "transformers>=4.41.2",
]

[project.urls]
Homepage = "https://github.com/rootonchair/nunchaku-lite"
Documentation = "https://nunchaku-lite.readthedocs.io/en/latest/"
Issues = "https://github.com/rootonchair/nunchaku-lite/issues"

[project.optional-dependencies]
# Quantized text encoders via nunchaku_lite.text_encoders.load_text_encoder_bnb (CUDA).
bnb = [ "bitsandbytes>=0.45" ]
# Accepted for compatibility with instructions that use `nunchaku-lite[torch]`; the base install already has torch.
torch = []
# MLX runtime (Apple silicon): nunchaku_lite.mlx. Pipelines come from mflux (pip install mflux).
mlx = [
  "mlx>=0.30",
  "numpy",
]

[tool.black]
line-length = 120
target-version = [ 'py311' ]

[tool.ruff]
line-length = 120

[tool.pytest.ini_options]
pythonpath = [ "src" ]
testpaths = [ "tests" ]
markers = [
  "full_inference: GPU/network-dependent end-to-end inference tests",
]
